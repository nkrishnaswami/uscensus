[project]
name = "uscensus"
version = "0.3.0"
description = "This module fetches metadata for the Census Data API to make it easier to find relevant data sets and variables to query, and returns data as a Pandas dataframe."
authors = [{ name = "Natarajan Krishnaswami", email = "nkrish@acm.org" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiosqlite~=0.20",
    "geopandas~=1.1",
    "httpx~=0.28",
    "httpx-caching>=0.1a4,<0.2",
    "pandas>=2.2.3",
    "shapely~=2.0",
    "sqlalchemy[asyncio]~=2.0",
    "pydantic~=2.10",
    "async-property~=0.2",
    "async-cache~=2.0",
]

[project.optional-dependencies]
whoosh = ["whoosh>=2.7.4,<3"]
pymongo = ["pymongo>=4.10.1,<5"]
arcgis = ["arcgis"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["stubs"]

[tool.mypy]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["async_property.*", "cache.*", "arcgis.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest~=9.0",
    "pytest-asyncio~=1.4",
    "respx~=0.21",
    "docutils>=0.3",
    "ruff>=0.8.3",
    "mypy>=1.13.0",
    "types-shapely>=2.1.0.20260728",
    "types-geopandas>=1.1.4.20260728",
    "pre-commit>=4.6.1",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["D100", "D105", "D401", "D417", "G004", "EM101", "TRY003", "ANN003", "PD901", "TD", "FIX"]
"__init__.py" = ["D104", "E402"]
"test/**" = ["ANN001", "ANN201", "ANN202", "S101", "D", "FBT", "PLR", "E501", "N", "PT007", "PT011", "PTH"]
